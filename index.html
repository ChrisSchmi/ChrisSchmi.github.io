<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="ChrisSchmi">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Cool links for developers. Sometimes a little food stuff.">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="images/favicons/favicon.ico" type="image/x-icon">
    
    <title>Cool links for developers.</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cookieconsent2/3.1.0/cookieconsent.min.js"></script>
    <script>
        window.addEventListener("load", function(){
            window.cookieconsent.initialise({
                "palette": {
                    "popup": { "background": "#000000", "text": "#ffffff" },
                    "button": { "background": "#ffffff", "text": "#000" }
                },
                "content": { "dismiss": "OK" }
            })
        });
    </script>

    <link rel="stylesheet" href="content/style.css">
    <style>
        body { padding-top: 80px; padding-bottom: 80px; }
        #themeToggler { border: none; background: none; font-size: 1.2rem; }
        [v-cloak] { display: none; }
    </style>
</head>

<body>
    <div id="app">
      <nav class="navbar navbar-expand-md bg-body-tertiary fixed-top border-bottom">
          <div class="container">
              <a class="navbar-brand" href="#">ChrisSchmi.github.io</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarCollapse">
                  <ul class="navbar-nav ms-auto mb-2 mb-md-0 align-items-center">    
                    <li class="nav-item">
                          <button @click="toggleTheme" class="nav-link btn btn-link" id="themeToggler" title="Theme umschalten">
                              <span id="themeIcon">{{ themeIcon }}</span>
                          </button>
                      </li>                                  
                      <li class="nav-item">
                          <a class="nav-link" href="#">Home</a>
                      </li>
                      <li class="nav-item">
                          <a class="nav-link" href="https://github.com/ChrisSchmi" target="_blank" rel="noopener">GitHub</a>
                      </li>
                      <li class="nav-item dropdown">
                          <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">About me</a>
                          <div class="dropdown-menu dropdown-menu-end">
                              <a class="dropdown-item" href="https://www.linkedin.com/in/chrisschmi" target="_blank">LinkedIn</a>
                              <a class="dropdown-item" href="https://www.xing.com/profile/Christian_Schmidt832" target="_blank">XING</a>
                          </div>
                      </li>
                      <li class="nav-item dropdown">
                          <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Publications</a>
                          <div class="dropdown-menu dropdown-menu-end">
                              <a class="dropdown-item" href="./publications/2009-poster-cvci.pdf" target="_blank">Poster PDF</a>
                              <a class="dropdown-item" href="https://www.hivemq.com/case-studies/caso/" target="_blank">Case Study (HiveMQ)</a>
                          </div>
                      </li>            
                  </ul>
              </div>
          </div>
      </nav>

      <main>
          <div class="container">
              <div class="input-group mb-4">
                  <span class="input-group-text">Search Tags</span>
                  <input type="text" class="form-control" placeholder="search for tags..." v-model="searchphrase" v-on:input="filteredList">
                  <button class="btn btn-outline-secondary" type="button" v-on:click="clearsearch();">x</button>
              </div>

              <p v-if="loading" class="text-center">Loading...</p>
              
              <div class="alert alert-info text-center" v-if="(!loading && !hasSearchResults)">
                  Sorry - no search results
              </div>

              <div class="row g-4" v-if="!loading">
                  <div class="col-12 col-md-6 col-lg-4" v-for="p in posts.entries" :key="p.Date" v-cloak>
                      <div class="card h-100 shadow-sm">
                          <div class="card-body">
                              <post-entry :post="p" @set-search="setsearch"></post-entry>
                          </div>
                      </div>
                  </div>
              </div>
          </div>

          <dialog id="mydialog" class="p-4 border-0 rounded shadow" style="width: 80%; height: 80%;">
              <div class="d-flex justify-content-between align-items-center mb-3">
                  <h2 class="h4 mb-0">Data protection</h2>
                  <button id="btn-close" class="btn-close"></button>
              </div>
              <iframe src="/dataprotection.html" width="100%" height="85%" frameborder="0"></iframe>
          </dialog>
      </main>

      <footer>
          <nav class="navbar fixed-bottom bg-body-tertiary border-top">
              <div class="container">
                  <ul class="navbar-nav flex-row gap-3">
                      <li class="nav-item">
                          <a class="nav-link small" @click="openDataProtection">Dataprotection</a>
                      </li>
                      <li class="nav-item">
                          <a class="nav-link small" @click="clearLocalCache">Clear Cache</a>
                      </li>
                  </ul>
              </div>
          </nav>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.26/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/html" id="postEntry">
        <div class="mb-2">
            <div class="text-uppercase small fw-bold opacity-50 mb-1" style="color: var(--bs-primary)">
                {{ post.Date }}
            </div>
            <h3 v-if="post.Title" class="h5 fw-bold mb-3">{{ post.Title }}</h3>
            <div v-for="c in post.Content" class="mb-3">
                <p class="mb-2">{{ c.Text }}</p>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <a :href="c.Link" target="_blank" rel="noopener" class="btn btn-sm btn-outline-info rounded-pill py-0">Link ↗</a>
                    <span class="badge rounded-pill bg-secondary" v-for="t in c.Tags">
                        <a class="text-white text-decoration-none" style="cursor:pointer" @click="$emit('setSearch', t)">#{{ t }}</a>
                    </span>
                </div>
            </div>
        </div>
    </script>

    <script>
        const { createApp } = Vue;

const postEntry = {
    template: '#postEntry',
    props: { post: Object },
    emits: ['setSearch']
};

createApp({
    components: { 'post-entry': postEntry },
    data() {
        return {
            loading: false,
            allPosts: [],
            posts: { entries: [] },
            searchphrase: '',
            hasSearchResults: true,
            // Reaktive Variable für das Theme-Icon
            currentTheme: document.documentElement.getAttribute('data-bs-theme') || 'light'
        }
    },
    computed: {
        // Berechnet das Icon basierend auf dem aktuellen Theme
        themeIcon() {
            var self = this;
            return self.currentTheme === 'dark' ? '☀️' : '🌙';
        }
    },
    methods: {
        // --- Theme Logik ---
        toggleTheme() {
            var self = this;
            const newTheme = self.currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            self.currentTheme = newTheme; // Update triggert das Computed Icon
        },

        // --- Hilfsfunktionen ---
        clearLocalCache() {
            if (confirm("Möchtest du den Cache wirklich leeren?")) {
                caches.keys().then(names => {
                    for (let name of names) caches.delete(name);
                });
                window.location.reload();
            }
        },

        openDataProtection() {
            const dialog = document.querySelector("#mydialog");
            const closeButton = document.querySelector("#btn-close");
            closeButton.onclick = () => dialog.close();
            dialog.showModal();
        },

        // Hilfsfunktion intern (nicht mehr am Prototyp von Array, um Vue sauber zu halten)
        getUniqueEntries(arr) {
            return arr.filter((value, index, self) => self.indexOf(value) === index);
        },

        // --- Suche & Posts ---
        filteredList() {
            if (!this.searchphrase) {
                this.posts = this.allPosts;
                this.hasSearchResults = true;
                return;
            }
            const s = this.searchphrase.toLowerCase();
            const filtered = this.allPosts.entries.filter(entry => 
                entry.Content.some(c => c.Tags && c.Tags.some(t => t.toLowerCase().includes(s)))
            );
            this.hasSearchResults = filtered.length > 0;
            this.posts = { entries: this.getUniqueEntries(filtered) };
        },

        setsearch(phrase) {
            this.searchphrase = phrase;
            this.filteredList();
            window.scrollTo(0, 0);
        },

        clearsearch() {
            this.searchphrase = '';
            this.filteredList();
            window.scrollTo(0, 0);
        }
    },
    async mounted() {
        this.loading = true;
        try {
            const response = await fetch('./scripts/posts.json');
            const data = await response.json();
            this.allPosts = data;
            this.posts = data;
        } catch (e) {
            console.error("Fetch error", e);
        } finally {
            this.loading = false;
        }
    }
}).mount('#app');
    </script>
</body>
</html>
